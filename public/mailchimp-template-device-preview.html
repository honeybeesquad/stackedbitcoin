<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mailchimp Template Device Preview</title>
    <style>
      :root {
        --bg: #f4f6f7;
        --ink: #161718;
        --muted: #4b5559;
        --frame: #161718;
        --surface: #ffffff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, sans-serif;
      }
      .wrap {
        max-width: 1300px;
        margin: 0 auto;
        padding: 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 14px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(280px, 1fr));
        gap: 18px;
      }
      .panel {
        background: var(--surface);
        border: 2px solid var(--frame);
        border-radius: 14px;
        overflow: hidden;
      }
      .label {
        padding: 10px 12px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        border-bottom: 2px solid var(--frame);
      }
      .stage {
        display: flex;
        justify-content: center;
        padding: 14px;
        background: #e8edee;
      }
      iframe {
        border: 2px solid var(--frame);
        border-radius: 10px;
        background: white;
      }
      .desktop {
        width: 640px;
        height: 860px;
      }
      .mobile {
        width: 390px;
        height: 844px;
      }
      @media (max-width: 1100px) {
        .grid { grid-template-columns: 1fr; }
      }
      @media (max-width: 460px) {
        .wrap { padding: 12px; }
        .mobile { width: 340px; height: 740px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Stacked Mailchimp Template Preview</h1>
      <p>Desktop and mobile render of <code>mailchimp-template-preview.html</code>.</p>
      <div class="grid">
        <section class="panel">
          <div class="label">Desktop (640px frame)</div>
          <div class="stage">
            <iframe class="desktop" src="mailchimp-template-preview.html" title="Desktop preview"></iframe>
          </div>
        </section>
        <section class="panel">
          <div class="label">Mobile (390px frame)</div>
          <div class="stage">
            <iframe class="mobile" src="mailchimp-template-preview.html" title="Mobile preview"></iframe>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
